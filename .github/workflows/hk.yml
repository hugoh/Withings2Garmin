name: hk

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    permissions:
      contents: read
      packages: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hugoh/gh-workflows/setup@1e09f883bc388f58e179d22768c320a1fe256998 # v1.40.14
      - uses: hugoh/gh-workflows/hk-check@1e09f883bc388f58e179d22768c320a1fe256998 # v1.40.14
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
