name: hk

permissions:
  contents: read
  packages: read
  statuses: write

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
        github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: hugoh/gh-workflows/setup@8c946a496e3f02569b0964bda0eba79a2082660d # v1.40.8
      - uses: hugoh/gh-workflows/hk-check@8c946a496e3f02569b0964bda0eba79a2082660d # v1.40.8
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
