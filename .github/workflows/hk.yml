name: hk

permissions:
  contents: read
  packages: read
  statuses: write

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
        github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: hugoh/gh-workflows/setup@c95078d6578bc039453fc9c865a0bc651dc00982 # v1.40.7
      - uses: hugoh/gh-workflows/hk-check@c95078d6578bc039453fc9c865a0bc651dc00982 # v1.40.7
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
