name: hk

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    permissions:
      contents: read
      packages: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hugoh/gh-workflows/setup@8d17bc6b4d7edc0bbec893e0466eb0ba60728721 # v1.40.27
      - uses: hugoh/gh-workflows/hk-check@8d17bc6b4d7edc0bbec893e0466eb0ba60728721 # v1.40.27
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
