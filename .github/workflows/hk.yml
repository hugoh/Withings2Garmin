name: hk

permissions:
  contents: read
  packages: read
  statuses: write

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number ||
        github.ref }}
      cancel-in-progress: true
    timeout-minutes: 10
    steps:
      - uses: hugoh/gh-workflows/setup@7e1836747c24d88f02af41710dd3e5bd95429afd # v1.40.9
      - uses: hugoh/gh-workflows/hk-check@7e1836747c24d88f02af41710dd3e5bd95429afd # v1.40.9
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
